:root{
  --bg:oklch(95.6% .018 75); --ink:oklch(21% .02 50); --ink-2:oklch(21% .02 50/.6); --hairline:oklch(21% .02 50/.1);
  --fill:oklch(40% .03 60/.08); --clay:oklch(60% .145 40); --clay-2:oklch(50% .13 35); --danger:oklch(58% .2 25);
  --glass:rgb(255 255 255/.55); --rim:rgb(255 255 255/.85); --rim-low:rgb(255 255 255/.3);
  --mesh:radial-gradient(70% 50% at 85% 5%,oklch(78% .12 45/.75),transparent 70%),radial-gradient(60% 45% at 5% 45%,oklch(85% .08 150/.6),transparent 70%),radial-gradient(80% 55% at 90% 100%,oklch(85% .1 80/.65),transparent 70%);
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Arabic","Inter","IBM Plex Sans Arabic",system-ui,sans-serif;
  --spring:cubic-bezier(.32,1.4,.5,1); color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:oklch(16% .012 50); --ink:oklch(96% .01 80); --ink-2:oklch(96% .01 80/.6); --hairline:oklch(96% .01 80/.12);
  --fill:oklch(96% .01 80/.08); --clay:oklch(66% .15 42); --danger:oklch(70% .18 25);
  --glass:rgb(255 255 255/.07); --rim:rgb(255 255 255/.22); --rim-low:rgb(255 255 255/.06);
  --mesh:radial-gradient(70% 50% at 85% 5%,oklch(45% .13 40/.7),transparent 70%),radial-gradient(60% 45% at 5% 45%,oklch(38% .08 160/.55),transparent 70%),radial-gradient(80% 55% at 90% 100%,oklch(42% .1 75/.5),transparent 70%);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:oklch(16% .012 50); --ink:oklch(96% .01 80); --ink-2:oklch(96% .01 80/.6); --hairline:oklch(96% .01 80/.12);
  --fill:oklch(96% .01 80/.08); --clay:oklch(66% .15 42); --danger:oklch(70% .18 25);
  --glass:rgb(255 255 255/.07); --rim:rgb(255 255 255/.22); --rim-low:rgb(255 255 255/.06);
  --mesh:radial-gradient(70% 50% at 85% 5%,oklch(45% .13 40/.7),transparent 70%),radial-gradient(60% 45% at 5% 45%,oklch(38% .08 160/.55),transparent 70%),radial-gradient(80% 55% at 90% 100%,oklch(42% .1 75/.5),transparent 70%);
  color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;display:grid;place-items:center;
  padding:calc(env(safe-area-inset-top,0px) + 24px) 20px calc(env(safe-area-inset-bottom,0px) + 24px);overflow:hidden}
body::before{content:"";position:fixed;inset:-10%;background:var(--mesh);z-index:-1;animation:drift 18s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(-3%,2%,0) scale(1.06)}}
.lock{width:100%;max-width:360px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:22px;animation:in .7s var(--spring) both}
@keyframes in{from{opacity:0;transform:translateY(16px) scale(.97)}}
.mark{width:84px;height:84px;border-radius:24px;display:grid;place-items:center;color:#fff;
  background:linear-gradient(155deg,oklch(68% .15 46),var(--clay-2));box-shadow:inset 0 1.5px 0 rgb(255 255 255/.45),inset 0 -1px 0 rgb(0 0 0/.1),0 18px 40px oklch(50% .14 38/.38)}
.mark{background:none;box-shadow:0 18px 40px oklch(45% .13 35/.35);overflow:hidden}.mark svg{width:84px;height:84px;display:block}
.langsw{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:16px;display:flex;gap:2px;padding:3px;border-radius:999px;background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);box-shadow:inset 0 1px 0 var(--rim),0 4px 14px oklch(30% .04 50/.1);z-index:5}
.langsw button{border:0;background:none;font:inherit;font-size:13.5px;font-weight:500;color:var(--ink-2);padding:6px 13px;border-radius:999px;cursor:pointer}
.langsw button.on{background:rgb(255 255 255/.75);color:var(--ink);font-weight:650;box-shadow:0 2px 8px oklch(30% .04 50/.12)}
button.go.alt{background:var(--glass);color:var(--ink);box-shadow:inset 0 1px 0 var(--rim),0 2px 8px oklch(30% .04 50/.08);display:flex;align-items:center;justify-content:center;gap:8px}
button.go.alt svg{width:22px;height:22px}
.offer{width:100%;display:flex;flex-direction:column;gap:10px;padding:18px;border-radius:26px;background:var(--glass);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);box-shadow:inset 0 1px 0 var(--rim),0 20px 50px oklch(30% .04 50/.14)}
.offer b{font-size:17px}.offer span{color:var(--ink-2);font-size:14px}
.link{border:0;background:none;font:inherit;color:var(--ink-2);font-size:15px;padding:8px;cursor:pointer}
h1{margin:0;font-size:34px;font-weight:800;line-height:1.1}
.sub{margin:6px 0 0;color:var(--ink-2);font-size:15px}
form{width:100%;display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:30px;background:var(--glass);
  -webkit-backdrop-filter:blur(30px) saturate(190%);backdrop-filter:blur(30px) saturate(190%);border:.5px solid var(--rim-low);
  box-shadow:inset 0 1px 0 var(--rim),0 2px 6px oklch(30% .04 50/.06),0 24px 60px oklch(30% .04 50/.14)}
.field{position:relative}
#un{padding:0 16px!important;margin-bottom:0}
input[type=password],input[type=text],input[type=email]{width:100%;height:54px;border-radius:16px;border:.5px solid var(--hairline);background:var(--fill);color:var(--ink);
  font:inherit;font-size:17px;padding:0 52px 0 16px;outline:none;transition:box-shadow .2s,background .2s;direction:ltr;text-align:start}
input:focus{background:rgb(255 255 255/.5);box-shadow:0 0 0 3px oklch(60% .145 40/.25)}
.eye{position:absolute;inset-block:0;right:6px;margin:auto;width:42px;height:42px;border:0;background:none;color:var(--ink-2);border-radius:12px;display:grid;place-items:center;cursor:pointer}
.eye svg{width:22px;height:22px}
button.go{height:54px;border:0;border-radius:999px;font:inherit;font-size:17px;font-weight:700;color:#fff;cursor:pointer;
  background:linear-gradient(170deg,oklch(65% .15 44),var(--clay-2));box-shadow:inset 0 1px 0 rgb(255 255 255/.35),0 8px 22px oklch(50% .14 38/.35);
  transition:transform .35s var(--spring),opacity .2s}
button.go:active{transform:scale(.97)}
button.go[disabled]{opacity:.7}
.remember{display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;color:var(--ink-2);cursor:pointer;user-select:none}
.remember input{width:18px;height:18px;accent-color:var(--clay);margin:0}
.tabs{display:flex;gap:2px;padding:3px;border-radius:999px;background:var(--fill);width:100%}
.tabs button{flex:1;border:0;background:none;font:inherit;font-size:15px;font-weight:500;color:var(--ink-2);padding:9px;border-radius:999px;cursor:pointer}
.tabs button.on{background:rgb(255 255 255/.8);color:var(--ink);font-weight:650;box-shadow:0 2px 8px oklch(30% .04 50/.12)}
#su{width:100%;display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:30px;background:var(--glass);-webkit-backdrop-filter:blur(30px) saturate(190%);backdrop-filter:blur(30px) saturate(190%);border:.5px solid var(--rim-low);box-shadow:inset 0 1px 0 var(--rim),0 2px 6px oklch(30% .04 50/.06),0 24px 60px oklch(30% .04 50/.14)}
#su input{padding:0 16px!important}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sumsg{margin:0;font-size:14px;color:var(--ink-2)}.sumsg:empty{display:none}
.err{min-height:20px;margin:0;font-size:14px;font-weight:600;color:var(--danger)}
.err.hint{color:var(--ink-2);font-weight:500}
.shake{animation:shake .45s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.pl{font-size:12.5px;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;margin-top:-8px}
.pn{margin:-10px 0 0;max-width:300px;font-size:11.5px;line-height:1.45;color:var(--ink-2);opacity:.85}.pn:empty{display:none}
.foot{font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.foot svg{width:13px;height:13px}
.spin{width:20px;height:20px;border-radius:50%;border:2.5px solid rgb(255 255 255/.4);border-top-color:#fff;animation:sp .8s linear infinite;display:inline-block;vertical-align:-4px}
@keyframes sp{to{transform:rotate(1turn)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

    <button class="go" id="go" type="submit"></button>
    <button class="go alt" id="fid" type="button" hidden></button>
    <label class="remember"><input type="checkbox" id="rem" checked><span id="r"></span></label>
  </form>
  <p class="err" id="err" role="alert"></p>
  <div class="offer" id="offer" hidden><b id="of-t"></b><span id="of-d"></span><button class="go" id="of-y" type="button"></button><button class="link" id="of-n" type="button"></button></div>

function dev(){const ua=navigator.userAgent,ipad=/iPad/.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1),ios=/iPhone|iPod/.test(ua)||ipad;

  if(!$('go').disabled)$('go').textContent=L('تسجيل الدخول','Sign in');$('r').textContent=L('تذكّر هذا الجهاز','Remember this device');

  $('ft').textContent=L('مشفّر بالكامل على جهازك','End-to-end encrypted on your device');
  $('pl').textContent=L('سياسة الخصوصية','Privacy policy');$('pl').href='privacy.html?lang='+lang;
  if(ANALYTICS)$('pn').textContent=L('للأمان، نسجّل مرات الفتح والمدينة التقريبية ونوع الجهاز والشاشات والأزرار المستخدمة. لا نسجّل المبالغ ولا ما تكتبه، ولا نحفظ عنوان IP.','For security, opens, approximate city, device type and the screens and buttons used are recorded. Amounts and anything you type are not, and IP addresses are not stored.');$('pw').placeholder=L('كلمة المرور','Password');$('un').placeholder=L('اسم المستخدم أو البريد','Username or email');
  $('t-in').textContent=L('تسجيل الدخول','Sign in');$('t-up').textContent=L('حساب جديد','Sign up');
  $('su-f').placeholder=L('الاسم الأول','First name');$('su-l').placeholder=L('اسم العائلة','Last name');$('su-e').placeholder=L('البريد الإلكتروني','Email');
  $('su-p').placeholder=L('كلمة المرور','Password');$('su-go').textContent=L('إنشاء حساب','Create account');
  $('of-t').textContent=L('استخدم Face ID في المرة القادمة؟','Use Face ID next time?');$('of-d').textContent=L('افتح بيتنا بنظرة، دون كتابة كلمة المرور.','Open Beitna with a glance instead of typing the password.');
  $('of-y').textContent=L('فعّل Face ID','Turn on Face ID');$('of-n').textContent=L('ليس الآن','Not now')}

async function openApp(raw,role,keep,method,name){
  const key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
  const html=dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(PAYLOAD.iv)},key,unb64(PAYLOAD.ct)));
  const rec=JSON.stringify({kid:PAYLOAD.kid,k:b64(raw),role,name:name||''});
  try{(keep&&role==='admin'?localStorage:sessionStorage).setItem(AUTH,rec)}catch(e){}  // guests: this session only
  track('unlock',role,method);
  document.open();document.write(html);document.close();
}
async function unwrap(pw,user){
  const base=await crypto.subtle.importKey('raw',enc.encode(user.trim().toLowerCase()+'\n'+pw),'PBKDF2',false,['deriveKey']);
  return Promise.any(PAYLOAD.slots.map(async s=>{
    const kek=await crypto.subtle.deriveKey({name:'PBKDF2',salt:unb64(s.salt),iterations:PAYLOAD.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    const b=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(s.iv)},kek,unb64(s.key)));
    return {raw:b.slice(0,32).buffer,role:s.role,name:dec.decode(b.slice(32))}}));
}

// ---- Face ID (WebAuthn passkey + PRF): the passkey's PRF secret encrypts the app key, so nothing usable is stored in plain form ----
const PRF_SALT=enc.encode('beitna-faceid-prf-v1'.padEnd(32,'.'));
async function canFaceID(){try{if(!window.PublicKeyCredential||!await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable())return false;
  if(PublicKeyCredential.getClientCapabilities){const c=await PublicKeyCredential.getClientCapabilities();if(c&&('extension:prf' in c))return !!c['extension:prf']}return true}catch(e){return false}}
async function prfKey(out){return crypto.subtle.importKey('raw',out,'AES-GCM',false,['encrypt','decrypt'])}
async function enableFaceID(raw,role,name){
  const cred=await navigator.credentials.create({publicKey:{rp:{name:'Beitna'},user:{id:crypto.getRandomValues(new Uint8Array(16)),name:'beitna-'+role,displayName:'Beitna'},
    challenge:crypto.getRandomValues(new Uint8Array(32)),pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
    authenticatorSelection:{authenticatorAttachment:'platform',residentKey:'preferred',userVerification:'required'},timeout:60000,extensions:{prf:{eval:{first:PRF_SALT}}}}});
  const ext=cred.getClientExtensionResults().prf||{};if(!ext.enabled&&!ext.results)throw new Error('prf');
  let out=ext.results&&ext.results.first;
  if(!out){const a=await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),allowCredentials:[{type:'public-key',id:cred.rawId}],userVerification:'required',extensions:{prf:{eval:{first:PRF_SALT}}}}});
    out=(a.getClientExtensionResults().prf||{}).results?.first;if(!out)throw new Error('prf')}
  const iv=crypto.getRandomValues(new Uint8Array(12)),ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},await prfKey(out),raw);
  localStorage.setItem(FID,JSON.stringify({id:b64(cred.rawId),kid:PAYLOAD.kid,iv:b64(iv),ct:b64(ct),role,name:name||''}));
}
async function faceUnlock(){const f=JSON.parse(localStorage.getItem(FID));
  const a=await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),allowCredentials:[{type:'public-key',id:unb64(f.id)}],userVerification:'required',extensions:{prf:{eval:{first:PRF_SALT}}}}});
  const out=(a.getClientExtensionResults().prf||{}).results?.first;if(!out)throw new Error('prf');
  const raw=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(f.iv)},await prfKey(out),unb64(f.ct));return openApp(raw,f.role,false,'faceid',f.name)}

function showLock(){texts();$('lock').hidden=false;track('view');
  let f=null;try{f=JSON.parse(localStorage.getItem(FID))}catch(e){}
  if(f&&f.kid===PAYLOAD.kid){$('fid').hidden=false;$('fid').onclick=async()=>{$('err').textContent='';try{await faceUnlock()}catch(e){$('err').textContent=L('لم يكتمل Face ID. استخدم كلمة المرور.','Face ID didn\'t complete. Use the password.')}}}
  else{try{localStorage.removeItem(FID)}catch(e){}
    // not set up yet: still show the button; tapping it explains the one-time step
    canFaceID().then(ok=>{if(!ok)return;$('fid').hidden=false;$('fid').onclick=()=>{wantFace=true;$('rem').checked=true;$('err').classList.add('hint');
      $('err').textContent=L('سجّل الدخول بحساب المدير مرة واحدة لتفعيل Face ID.','Sign in with the admin account once to turn on Face ID.');$('pw').focus()}});
    setTimeout(()=>$('pw').focus(),350)}}
let wantFace=false;
// Sign in / Sign up tabs. Sign up doesn't go anywhere during testing: it explains that access is by invitation.
const tab=up=>{$('t-in').classList.toggle('on',!up);$('t-up').classList.toggle('on',up);$('f').hidden=up;$('su').hidden=!up;$('err').textContent='';$('su-msg').textContent='';
  $('s').textContent=up?L('أنشئ حسابك','Create your account'):L('سجّل الدخول للمتابعة','Sign in to continue');setTimeout(()=>$(up?'su-f':'un').focus(),50)};
$('t-in').onclick=()=>tab(false);$('t-up').onclick=()=>tab(true);
$('su').onsubmit=e=>{e.preventDefault();const f=$('su-f').value.trim();if(!f||!$('su-l').value.trim()||!$('su-e').value.trim()||!$('su-p').value)return;
  $('su-msg').textContent=L(`شكراً ${f}. بيتنا حالياً بالدعوة فقط خلال فترة التجربة. سنتواصل معك عند فتح التسجيل.`,`Thanks, ${f}. Beitna is invitation-only while we test. We'll be in touch when sign-ups open.`);
  $('su-p').value=''};
$('eye').onclick=()=>{const p=$('pw');p.type=p.type==='password'?'text':'password'};
const resetGo=()=>{$('go').disabled=false;$('go').textContent=L('تسجيل الدخول','Sign in')};
$('f').onsubmit=async e=>{e.preventDefault();const pw=$('pw').value,un=$('un').value;if(!pw||!un.trim())return;
  $('go').disabled=true;$('go').innerHTML='<span class="spin"></span>';$('err').textContent='';$('err').classList.remove('hint');
  let hit;try{hit=await unwrap(pw,un)}catch(_){try{if(pw.trim()!==pw)hit=await unwrap(pw.trim(),un)}catch(_){}}
  if(!hit){track('fail');resetGo();$('err').textContent=L('اسم المستخدم أو كلمة المرور غير صحيحة','Incorrect username or password');const f=$('f');f.classList.remove('shake');void f.offsetWidth;f.classList.add('shake');$('pw').select();return}
  const keep=$('rem').checked,open=k=>openApp(hit.raw,hit.role,k,'password',hit.name).catch(e=>{resetGo();$('err').textContent=L('تعذّر فتح التطبيق: ','Could not open the app: ')+e.message});
  // admins who want to stay signed in are offered Face ID instead of keeping the key on the device
  if(wantFace&&hit.role!=='admin'){$('err').classList.remove('hint');$('err').textContent=L('Face ID متاح لحساب المدير فقط.','Face ID is only available for the admin account.')}
  // sign-in goes straight into the app; the Face ID offer only appears if the person tapped 'Unlock with Face ID' to set it up
  if(wantFace&&hit.role==='admin'&&await canFaceID()){$('f').hidden=true;$('offer').hidden=false;
    $('of-y').onclick=async()=>{try{await enableFaceID(hit.raw,hit.role,hit.name);open(false)}catch(e){open(true)}};$('of-n').onclick=()=>open(true);return}
  open(keep)};
(async()=>{
  if(!PAYLOAD||!crypto.subtle){showLock();$('err').textContent=L('هذه الصفحة غير مبنية أو تحتاج اتصالاً آمناً (https).','This page is not built, or needs a secure (https) connection.');$('go').disabled=true;return}
  for(const st of[localStorage,sessionStorage]){let a;try{a=JSON.parse(st.getItem(AUTH))}catch(e){}
    if(a&&a.kid===PAYLOAD.kid){try{return await openApp(unb64(a.k),a.role,st===localStorage,'remembered',a.name)}catch(e){}}
    try{st.removeItem(AUTH)}catch(e){}}
  showLock();
})();
})();
</script></body></html>
